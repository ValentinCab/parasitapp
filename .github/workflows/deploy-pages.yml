name: Publicar Atlas en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar la distribución estática
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
